services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEVIN_API_KEY: ${DEVIN_API_KEY:?Set DEVIN_API_KEY}
      DEVIN_ORGANIZATION_ID: ${DEVIN_ORGANIZATION_ID:?Set DEVIN_ORGANIZATION_ID}
      DEVIN_MAX_CONCURRENT_SESSIONS: ${DEVIN_MAX_CONCURRENT_SESSIONS:-3}
      DEVIN_MAX_ATTEMPTS: ${DEVIN_MAX_ATTEMPTS:-3}
      DEVIN_ANALYSIS_MAX_ATTEMPTS: ${DEVIN_ANALYSIS_MAX_ATTEMPTS:-12}
      DEVIN_ORCHESTRATOR_INTERVAL_MS: ${DEVIN_ORCHESTRATOR_INTERVAL_MS:-3000}
      DEVIN_SUBMITTING_TIMEOUT_SECONDS: ${DEVIN_SUBMITTING_TIMEOUT_SECONDS:-60}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET}
      SQLITE_DB_FILEPATH: ${SQLITE_DB_FILEPATH:?Set SQLITE_DB_FILEPATH}
    volumes:
      - sqlite-data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - "const response = await fetch('http://127.0.0.1:8000/health'); Deno.exit(response.ok ? 0 : 1);"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  sqlite-data:
