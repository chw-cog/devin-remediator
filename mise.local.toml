[tools]
"npm:smee-client" = "5.0.0"

[tasks.webhook-forwarder]
description = "Forward a Smee channel to the local server"
usage = '''
flag "-u --url <url>" help="Smee channel URL (creates a new channel if omitted)"
'''
run = 'smee ${usage_url:+-u "$usage_url"} -t http://localhost:8000/api/v1/webhook'
